[project]
name = "d3textdb"
version = "0.1.0"
description = "Database interface used by the text mining models and the D3 Annotation Hub"
authors = [{ name = "Emanuel Quadros", email = "emanuel.quadros@dsmz.de" }]
requires-python = ">=3.12"
readme = "README.md"
license = "MPL-2.0"
dependencies = [
  "bcrypt>=5.0.0",
  "email-validator>=2.2.0",
  "passlib>=1.7.4",
  "pendulum>=3.1.0",
  "pydantic-extra-types>=2.10.6",
  "rdflib>=7.0",
  "sqlalchemy>=2.0.41",
  "sqlmodel~=0.0.24",
  "tqdm>=4.67.3",
  "pysqlite3-binary>=0.5.4.post2",
  "pysqlite3>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
files = "."
# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[tool.ruff]
line-length = 80

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[tool.ruff.lint.per-file-ignores]
"**/scripts/**" = ["INP001"]
"**/tests/**" = ["D100", "D103", "S101", "PLR2004"]

[dependency-groups]
dev = [
  "beartype>=0.22.2",
  "icecream>=2.1.8",
  "ipython-autotime>=0.3.2",
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.6.14",
  "mkdocstrings[python]>=0.29.1",
  "pytest>=8.4.2",
  "pytest-beartype>=0.2.0",
  "rich>=14.0.0",
  "sqlalchemy-stubs>=0.4",
  "stackprinter>=0.2.12",
]
