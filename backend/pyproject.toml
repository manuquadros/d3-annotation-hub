[project]
name = "ahbackend"
version = "0.1.0"
description = "D3 Annotation Hub Backend"
authors = [{ name = "Emanuel Souza de Quadros" }]
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
dependencies = [
  "cryptography>=46.0.7",
  "fastapi[standard]>=0.136.1",
  "multimethod>=2.0",
  "pydantic>=2.11.4",
  "pyjwt>=2.12.0",
  "starlette>=1.1.0",
  "sqlmodel>=0.0.24",
  "tokenizers>=0.21.1",
  "uvicorn>=0.34.2",
  "d3textdb",
  "apiadapters",
  "xmlparser @ git+https://github.com/manuquadros/xmlparser.git@master",
  "pdfparser @ git+https://github.com/manuquadros/pdfparser.git@main",
  "gunicorn>=25.3.0",
  "tomlkit>=0.14.0",
  "xkcdpass>=1.30.0",
  "pyoxigraph>=0.5.9",
  "slowapi>=0.1.10",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
  "autodoc-pydantic>=2.2.0",
  "beartype>=0.21.0",
  "debugpy>=1.8.14",
  "devtools>=0.12.2",
  "icecream>=2.1.4",
  "ipython-autotime>=0.3.2",
  "ipython>=9.4",
  "memray>=1.14.0",
  "pre-commit>=4.2.0",
  "pudb>=2024.1.3",
  "pydata-sphinx-theme>=0.16.0",
  "pyls-memestra>=0.0.16",
  "pylsp-mypy>=0.6.9",
  "pylsp-rope>=0.1.17",
  "pytest-asyncio>=1",
  "pytest-cov>=6.1.1",
  "pytest-memray>=1.7.0",
  "pytest-sugar>=1.0.0",
  "pytest-watcher>=0.4.3",
  "pytest>=8.3.4",
  "python-lsp-server>=1.12.2",
  "rich>=13.9.4",
  "rope>=1.13.0",
  "ruff>=0.11",
  "sphinx-autobuild>=2024",
  "sphinx-book-theme>=1",
  "sphinx-pydantic>=0.1.1",
  "sphinx>=8.1.3",
  "stackprinter>=0.2.12",
  "types-tqdm>=4.67.0.20241221",
  "pip-audit>=2.10.0",
]

[tool.pdm.scripts]
dev = "python scripts/run.py"
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
test = "pytest"
test-cov = "pytest --cov=ahbackend --cov-report=term-missing"
docs-build.shell = "sphinx-apidoc -o docs/api src/ahbackend --force && sphinx-build docs docs/_build/html"
docs-serve = "sphinx-autobuild docs docs/_build/html --open-browser"
audit = "pip-audit"

[[tool.pdm.source]]
name = "private"
url = "https://download.pytorch.org/whl/cu124"

# d3textdb and apiadapters are vendored as git subtrees at the repo root and are
# runtime dependencies of the backend. They are declared as bare names in
# [project.dependencies] and pointed at the local checkouts here so both dev
# (`pdm install`) and production (`pdm install --prod`) resolve them offline.
# This uses uv's source table because the project runs on the uv resolver, which
# cannot expand pdm's ${PROJECT_ROOT} in a PEP 508 file:// URL.
[tool.uv.sources]
d3textdb = { path = "../d3textdb", editable = true }
apiadapters = { path = "../apiadapters", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py313"

# TCH is intentionally omitted: the stack uses beartype/pydantic runtime type
# checking, which needs annotation imports available at runtime, not moved into
# a TYPE_CHECKING block.
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Test fixtures carry real-world data (abstracts, XML bodies) and use short
# import aliases / blind exception asserts by convention.
"tests/**" = ["E501", "N817", "B017"]

[tool.ruff.lint.isort]
known-first-party = ["ahbackend"]

[tool.pylsp.plugins]
pylsp-mypy.enabled = true
